name: Deploy Payload Cloudflare CMS

on:
  workflow_dispatch:
  push:
    branches: [3.x]
    paths:
      - "templates/with-cloudflare-d1/**"
      - ".github/workflows/payload-cloudflare.yml"

permissions:
  contents: read

concurrency:
  group: payload-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/with-cloudflare-d1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3.x
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - run: pnpm config set dangerouslyAllowAllBuilds true
      - run: pnpm install --no-frozen-lockfile
      - run: node scripts/patch-payload-workers-hash.mjs
      - name: Set Worker runtime secret
        run: printf '%s' "$PAYLOAD_SECRET" | pnpm exec wrangler secret put PAYLOAD_SECRET --name payload-cms-prod-production
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: pnpm run deploy
        env:
          CLOUDFLARE_ENV: production
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
