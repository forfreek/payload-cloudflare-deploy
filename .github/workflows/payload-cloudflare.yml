name: Sync Payload 3.x and deploy Cloudflare template

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches: [3.x]
    paths:
      - "templates/with-cloudflare-d1/**"
      - ".github/workflows/payload-cloudflare.yml"

permissions:
  contents: write

concurrency:
  group: payload-cloudflare-3x
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Sync official Payload 3.x
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 3.x
      - run: |
          git remote add upstream https://github.com/payloadcms/payload.git
          git fetch upstream 3.x
          git merge --ff-only upstream/3.x
          git push origin 3.x

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/with-cloudflare-d1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3.x
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: templates/with-cloudflare-d1/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deploy
        env:
          CLOUDFLARE_ENV: production
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
